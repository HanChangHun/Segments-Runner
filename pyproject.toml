[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segments_runner"
version = "1.1.1"
description = "Run multiple segments of EdgeTPU models in sequence"
authors = [{ name = "Changhun Han", email = "ehwjs1914@naver.com" }]
readme = "README.md"
keywords = ["EdgeTPU", "segments", "runner"]
requires-python = ">=3.7,<3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "pycoral==2.0.0",
    "tflite_runtime==2.5.0.post1",
    "numpy>=1.16.0,<2.0.0",
    "packaging>=24.0",
    "pillow>=9.5.0",
]


[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"segments_runner" = ["test_data/*"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/HanChangHun/Segments-Runner"
"Repository" = "https://github.com/HanChangHun/Segments-Runner"
"Issues" = "https://github.com/HanChangHun/Segments-Runner/issues"

[dependency-groups]
dev = ["pytest>=7.0", "build>=1.1.1", "twine>=4.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.uv]
extra-index-url = [
    "https://google-coral.github.io/py-repo/",
    "http://163.152.162.112:10004/chun/stable/+simple/",
]
allow-insecure-host = ["163.152.162.112"]
